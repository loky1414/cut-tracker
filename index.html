<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IronTrack - Web Prototype</title>
<style>
  :root {
    --bg-phone: #000000;
    --card-bg: #1c1c1e;
    --card-inner: #2c2c2e;
    --accent: #30d158;
    --text: #ffffff;
    --subtext: #8e8e93;
    --border: #38383a;
  }
  * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", sans-serif; margin: 0; padding: 0; }
  body {
    background: #121214;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    padding: 20px;
  }

  /* 模擬 iPhone 16 Pro 外框 */
  .phone-frame {
    width: 390px;
    height: 820px;
    background: var(--bg-phone);
    border-radius: 54px;
    border: 12px solid #2e2e32;
    box-shadow: 0 30px 80px rgba(0,0,0,0.8), inset 0 0 4px rgba(255,255,255,0.2);
    position: relative;
    overflow: hidden;
    display: flex;
    flex-direction: column;
  }

  /* 動態島 (Dynamic Island) */
  .dynamic-island {
    position: absolute;
    top: 10px;
    left: 50%;
    transform: translateX(-50%);
    width: 120px;
    height: 35px;
    background: #000;
    border-radius: 20px;
    z-index: 100;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    color: var(--accent);
    font-size: 13px;
    font-weight: 700;
    border: 1px solid #333;
    transition: all 0.35s cubic-bezier(0.4, 0, 0.2, 1);
  }
  .dynamic-island.active {
    width: 280px;
    height: 42px;
    background: #111;
    justify-content: space-between;
    padding: 0 16px;
    box-shadow: 0 8px 20px rgba(0,0,0,0.6);
  }

  /* 內容滾動區 */
  .content-area {
    flex: 1;
    overflow-y: auto;
    padding: 60px 16px 80px 16px;
    color: var(--text);
  }
  .content-area::-webkit-scrollbar { display: none; }

  /* 頂部訓練概覽 */
  .header-box {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 20px;
  }
  .header-box h1 { font-size: 22px; font-weight: 800; }
  .timer-pill {
    background: var(--card-bg);
    padding: 6px 12px;
    border-radius: 20px;
    font-size: 12px;
    color: var(--subtext);
    border: 1px solid var(--border);
  }

  .volume-card {
    background: linear-gradient(135deg, #1c1c1e 0%, #252528 100%);
    border-radius: 16px;
    padding: 14px 18px;
    margin-bottom: 18px;
    border: 1px solid var(--border);
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .volume-card .val { font-size: 22px; font-weight: 800; color: var(--accent); }

  /* 動作卡片 */
  .card {
    background: var(--card-bg);
    border-radius: 18px;
    padding: 16px;
    margin-bottom: 18px;
    border: 1px solid var(--border);
  }
  .card-top {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 4px;
  }
  .exercise-name { font-size: 17px; font-weight: 700; }
  .plate-btn {
    font-size: 12px;
    color: var(--accent);
    background: var(--card-inner);
    padding: 4px 10px;
    border-radius: 12px;
    cursor: pointer;
    border: none;
  }
  .exercise-sub { font-size: 12px; color: var(--subtext); margin-bottom: 12px; }

  /* 表格區 */
  .set-grid {
    display: grid;
    grid-template-columns: 32px 42px 75px 65px 44px 38px;
    gap: 6px;
    align-items: center;
    text-align: center;
    margin-bottom: 8px;
  }
  .grid-header { font-size: 11px; color: var(--subtext); font-weight: 600; margin-bottom: 4px; }
  
  .badge-btn {
    background: var(--card-inner);
    border: none;
    border-radius: 6px;
    height: 28px;
    font-size: 11px;
    font-weight: 700;
    color: #fff;
    cursor: pointer;
  }
  .badge-btn.warmup { background: #ff9f0a; color: #000; }
  .badge-btn.drop { background: #bf5af2; }
  .badge-btn.fail { background: #ff453a; }

  input.set-input {
    background: var(--card-inner);
    border: 1px solid transparent;
    border-radius: 8px;
    height: 32px;
    width: 100%;
    color: #fff;
    font-size: 14px;
    font-weight: 600;
    text-align: center;
    outline: none;
  }
  input.set-input:focus { border-color: var(--accent); }

  .check-circle {
    width: 32px;
    height: 32px;
    border-radius: 50%;
    background: var(--card-inner);
    border: none;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 14px;
    color: var(--subtext);
    cursor: pointer;
    transition: 0.2s;
  }
  .check-circle.done {
    background: var(--accent);
    color: #000;
    font-weight: 900;
  }

  .e1rm-bar {
    font-size: 11px;
    color: var(--subtext);
    text-align: right;
    margin-top: 4px;
  }

  /* 底部導航欄 */
  .nav-bar {
    position: absolute;
    bottom: 0;
    left: 0;
    right: 0;
    height: 70px;
    background: rgba(28, 28, 30, 0.85);
    backdrop-filter: blur(20px);
    border-top: 1px solid var(--border);
    display: flex;
    justify-content: space-around;
    align-items: center;
    padding-bottom: 10px;
  }
  .nav-item { font-size: 10px; color: var(--subtext); text-align: center; cursor: pointer; }
  .nav-item.active { color: var(--accent); font-weight: 700; }
  .nav-icon { font-size: 18px; margin-bottom: 3px; display: block; }

  /* 彈窗 Modal */
  .modal-overlay {
    position: absolute;
    top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(0,0,0,0.75);
    backdrop-filter: blur(10px);
    z-index: 200;
    display: flex;
    flex-direction: column;
    justify-content: flex-end;
    transition: opacity 0.3s;
  }
  .modal-overlay.hidden { display: none; }
  
  .sheet {
    background: #1c1c1e;
    border-radius: 24px 24px 0 0;
    padding: 24px 20px 40px 20px;
    color: #fff;
    border-top: 1px solid #333;
  }
  .sheet h2 { font-size: 18px; margin-bottom: 14px; }
  .sheet-field { margin-bottom: 14px; }
  .sheet-field label { display: block; font-size: 12px; color: var(--subtext); margin-bottom: 6px; }
  .sheet-field select, .sheet-field input {
    width: 100%;
    padding: 10px;
    background: #2c2c2e;
    border: 1px solid #3a3a3c;
    border-radius: 10px;
    color: #fff;
    font-size: 14px;
    outline: none;
  }
  .btn-submit {
    width: 100%;
    padding: 14px;
    background: var(--accent);
    color: #000;
    border: none;
    border-radius: 12px;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
    margin-top: 8px;
  }
</style>
</head>
<body>

<div class="phone-frame">
  <!-- 動態島組間休息倒數 -->
  <div class="dynamic-island" id="island">
    <span id="island-icon">⏱️</span>
    <span id="island-text">90s</span>
    <span id="island-skip" style="display:none; font-size:11px; cursor:pointer;" onclick="stopTimer()">跳過</span>
  </div>

  <!-- 主訓練畫面 -->
  <div class="content-area">
    <div class="header-box">
      <div>
        <h1>今日訓練</h1>
        <div style="font-size: 12px; color: var(--subtext);">推日 (Push Day)</div>
      </div>
      <button class="plate-btn" onclick="openOnboarding()">👤 資料設定</button>
    </div>

    <!-- 總容量卡片 -->
    <div class="volume-card">
      <div>
        <div style="font-size: 12px; color: var(--subtext);">累積總容量</div>
        <div class="val"><span id="total-vol">0</span> kg</div>
      </div>
      <div class="timer-pill">進行中 00:25:30</div>
    </div>

    <!-- 動作 1：槓鈴臥推 -->
    <div class="card">
      <div class="card-top">
        <span class="exercise-name">槓鈴臥推 (Bench Press)</span>
        <button class="plate-btn" onclick="openPlateCalc(100)">計餅機 ⚙️</button>
      </div>
      <div class="exercise-sub">上次最佳: 100 kg × 8 次 ｜ 座椅格數: #3</div>

      <div class="set-grid grid-header">
        <div>組</div>
        <div>類型</div>
        <div>重量</div>
        <div>次數</div>
        <div>RPE</div>
        <div>完成</div>
      </div>

      <!-- 第一組 -->
      <div class="set-grid">
        <div style="font-size:12px; color:var(--subtext);">1</div>
        <button class="badge-btn warmup" onclick="toggleBadge(this)">W</button>
        <input type="number" class="set-input" value="60" id="w1" oninput="updateStats()">
        <input type="number" class="set-input" value="12" id="r1" oninput="updateStats()">
        <input type="number" class="set-input" value="7.0" step="0.5">
        <button class="check-circle" onclick="toggleSet(this, 1)">✓</button>
      </div>

      <!-- 第二組 -->
      <div class="set-grid">
        <div style="font-size:12px; color:var(--subtext);">2</div>
        <button class="badge-btn" onclick="toggleBadge(this)">常</button>
        <input type="number" class="set-input" value="100" id="w2" oninput="updateStats()">
        <input type="number" class="set-input" value="8" id="r2" oninput="updateStats()">
        <input type="number" class="set-input" value="8.5" step="0.5">
        <button class="check-circle" onclick="toggleSet(this, 2)">✓</button>
      </div>

      <div class="e1rm-bar" id="e1rm-text">估算 1RM: 124 kg</div>
    </div>

    <!-- 動作 2：坐姿啞鈴肩推 -->
    <div class="card">
      <div class="card-top">
        <span class="exercise-name">坐姿啞鈴肩推</span>
      </div>
      <div class="exercise-sub">上次最佳: 28 kg × 10 次</div>

      <div class="set-grid grid-header">
        <div>組</div>
        <div>類型</div>
        <div>重量</div>
        <div>次數</div>
        <div>RPE</div>
        <div>完成</div>
      </div>

      <div class="set-grid">
        <div style="font-size:12px; color:var(--subtext);">1</div>
        <button class="badge-btn" onclick="toggleBadge(this)">常</button>
        <input type="number" class="set-input" value="28" id="w3" oninput="updateStats()">
        <input type="number" class="set-input" value="10" id="r3" oninput="updateStats()">
        <input type="number" class="set-input" value="8.0" step="0.5">
        <button class="check-circle" onclick="toggleSet(this, 3)">✓</button>
      </div>
    </div>
  </div>

  <!-- 底部導航 -->
  <div class="nav-bar">
    <div class="nav-item active"><span class="nav-icon">🏋️</span>訓練</div>
    <div class="nav-item"><span class="nav-icon">📅</span>歷史</div>
    <div class="nav-item"><span class="nav-icon">📈</span>圖表</div>
    <div class="nav-item"><span class="nav-icon">👤</span>我的</div>
  </div>

  <!-- 槓餅計算器彈窗 -->
  <div class="modal-overlay hidden" id="plate-modal" onclick="closeModal('plate-modal')">
    <div class="sheet" onclick="event.stopPropagation()">
      <h2>槓片配置計算器</h2>
      <p id="plate-info" style="font-size:13px; color:var(--subtext); margin-bottom:14px;"></p>
      <div id="plate-result" style="font-size:14px; line-height:1.8;"></div>
      <button class="btn-submit" onclick="closeModal('plate-modal')">關閉</button>
    </div>
  </div>

  <!-- 首次初始化彈窗 (Onboarding) -->
  <div class="modal-overlay hidden" id="onboarding-modal">
    <div class="sheet">
      <h2>設定您的檔案 (Onboarding)</h2>
      <div class="sheet-field">
        <label>性別</label>
        <select id="user-gender"><option>男</option><option>女</option></select>
      </div>
      <div class="sheet-field">
        <label>體重 (kg)</label>
        <input type="number" id="user-weight" value="75">
      </div>
      <div class="sheet-field">
        <label>健身經驗</label>
        <select id="user-exp">
          <option>新手 (0 - 1 年)</option>
          <option selected>中階 (1 - 3 年)</option>
          <option>高階 (3 年以上)</option>
        </select>
      </div>
      <div class="sheet-field">
        <label>核心目標</label>
        <select id="user-goal">
          <option>肌肥大 (增肌)</option>
          <option>健力 (力量提升)</option>
          <option>維持健康 / 減脂</option>
        </select>
      </div>
      <button class="btn-submit" onclick="saveOnboarding()">開始訓練</button>
    </div>
  </div>
</div>

<script>
  let timerInterval = null;
  let remainingTime = 90;

  // 1. 完成組別與倒數計時
  function toggleSet(btn, id) {
    btn.classList.toggle('done');
    if (btn.classList.contains('done')) {
      startRestTimer(90);
    }
    updateStats();
  }

  function startRestTimer(seconds) {
    clearInterval(timerInterval);
    remainingTime = seconds;
    const island = document.getElementById('island');
    const text = document.getElementById('island-text');
    const skip = document.getElementById('island-skip');

    island.classList.add('active');
    skip.style.display = 'inline';

    timerInterval = setInterval(() => {
      let m = Math.floor(remainingTime / 60);
      let s = remainingTime % 60;
      text.innerText = `休息倒數: ${m}:${s < 10 ? '0' : ''}${s}`;
      remainingTime--;

      if (remainingTime < 0) {
        clearInterval(timerInterval);
        text.innerText = "休息結束！";
        skip.style.display = 'none';
        setTimeout(() => {
          island.classList.remove('active');
          text.innerText = "90s";
        }, 2000);
      }
    }, 1000);
  }

  function stopTimer() {
    clearInterval(timerInterval);
    const island = document.getElementById('island');
    document.getElementById('island-text').innerText = "已跳過";
    document.getElementById('island-skip').style.display = 'none';
    setTimeout(() => {
      island.classList.remove('active');
      document.getElementById('island-text').innerText = "90s";
    }, 1000);
  }

  // 2. 切換組別類型 (常規 -> 熱身 W -> 遞減 D -> 力竭 F)
  function toggleBadge(btn) {
    if (btn.innerText === '常') {
      btn.innerText = 'W';
      btn.className = 'badge-btn warmup';
    } else if (btn.innerText === 'W') {
      btn.innerText = 'D';
      btn.className = 'badge-btn drop';
    } else if (btn.innerText === 'D') {
      btn.innerText = 'F';
      btn.className = 'badge-btn fail';
    } else {
      btn.innerText = '常';
      btn.className = 'badge-btn';
    }
  }

  // 3. E1RM 與 總容量計算
  function updateStats() {
    let w2 = parseFloat(document.getElementById('w2').value) || 0;
    let r2 = parseFloat(document.getElementById('r2').value) || 0;
    if (w2 > 0 && r2 > 0) {
      let e1rm = Math.round(w2 * (36 / (37 - r2)));
      document.getElementById('e1rm-text').innerText = `估算 1RM: ${e1rm} kg (Brzycki)`;
    }

    // 計算打勾組別的總容量
    let total = 0;
    document.querySelectorAll('.card').forEach(card => {
      const rows = card.querySelectorAll('.set-grid:not(.grid-header)');
      rows.forEach(row => {
        const isDone = row.querySelector('.check-circle').classList.contains('done');
        if (isDone) {
          const inputs = row.querySelectorAll('.set-input');
          const weight = parseFloat(inputs[0].value) || 0;
          const reps = parseFloat(inputs[1].value) || 0;
          total += weight * reps;
        }
      });
    });
    document.getElementById('total-vol').innerText = total;
  }

  // 4. 槓餅計算器彈窗
  function openPlateCalc(targetWeight) {
    const modal = document.getElementById('plate-modal');
    const info = document.getElementById('plate-info');
    const res = document.getElementById('plate-result');

    const bar = 20;
    let perSide = Math.max(0, (targetWeight - bar) / 2);
    info.innerText = `目標總重: ${targetWeight} kg (扣除標準槓 20kg，單邊需裝 ${perSide} kg)`;

    const plates = [20, 15, 10, 5, 2.5, 1.25];
    let breakdown = [];
    let rem = perSide;

    plates.forEach(p => {
      let count = Math.floor(rem / p);
      if (count > 0) {
        breakdown.push(`<b>${p} kg</b> × ${count} 片`);
        rem -= count * p;
      }
    });

    res.innerHTML = breakdown.length > 0 ? breakdown.join('<br>') : "無需額外槓片";
    modal.classList.remove('hidden');
  }

  function closeModal(id) {
    document.getElementById(id).classList.add('hidden');
  }

  // 5. Onboarding 設定
  function openOnboarding() {
    document.getElementById('onboarding-modal').classList.remove('hidden');
  }
  function saveOnboarding() {
    closeModal('onboarding-modal');
  }

  // 首次打開自動檢查
  window.onload = function() {
    updateStats();
  };
</script>
</body>
</html>
