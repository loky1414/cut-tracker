<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>訓練 & 減脂追蹤 (Workout & Cut Tracker)</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      -webkit-tap-highlight-color: transparent;
      padding-top: env(safe-area-inset-top);
      padding-bottom: env(safe-area-inset-bottom);
    }
    input::-webkit-outer-spin-button, input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
    input[type=number] { -moz-appearance: textfield; }
  </style>
</head>
<body class="bg-black text-slate-100 min-h-screen pb-28 select-none">

  <!-- 頂部浮動計時器與狀態列 -->
  <header class="sticky top-0 z-40 bg-black/90 backdrop-blur-md border-b border-zinc-800/80 px-4 py-3">
    <div class="max-w-md mx-auto flex items-center justify-between">
      <div>
        <h1 class="text-xl font-extrabold text-white flex items-center gap-2">
          今日訓練
          <span id="workoutDurationText" class="text-xs font-normal text-zinc-400 bg-zinc-800/80 px-2 py-0.5 rounded-full">進行中 00:00:00</span>
        </h1>
        <p id="subRoutineTitle" class="text-xs text-zinc-400 mt-0.5">推日 (Push Day) · PPL 課表</p>
      </div>

      <!-- 90s 快捷計時掣 / 倒數狀態 -->
      <div id="restTimerBox" class="flex items-center gap-1.5 bg-zinc-800 border border-zinc-700/80 rounded-full px-3 py-1 cursor-pointer active:scale-95 transition" onclick="triggerRestTimer(90)">
        <span class="text-xs">⏱️</span>
        <span id="timerText" class="text-xs font-mono font-bold text-emerald-400">90s</span>
      </div>
    </div>
  </header>

  <!-- 主內容區域 (乾淨現代排版，無任何外圍假手機邊框) -->
  <main class="max-w-md mx-auto p-4 space-y-4">

    <!-- 頁籤 1: 訓練 (Workout) -->
    <div id="tab-workout" class="tab-content space-y-4">
      
      <!-- 總容量儀表板 -->
      <div class="bg-zinc-900 border border-zinc-800/90 rounded-2xl p-4 flex items-center justify-between">
        <div>
          <div class="text-[11px] text-zinc-400 font-medium">累積總容量</div>
          <div id="statTotalVolume" class="text-3xl font-black text-emerald-400 tracking-tight mt-0.5">0 <span class="text-sm font-normal text-zinc-400">kg</span></div>
        </div>
        <div class="text-right">
          <div class="text-[11px] text-zinc-400 font-medium">完成總組數</div>
          <div id="statTotalSets" class="text-xl font-bold text-white mt-0.5">0 <span class="text-xs font-normal text-zinc-400">組</span></div>
        </div>
      </div>

      <!-- 課表分化選擇卡片 -->
      <div class="bg-zinc-900/90 border border-zinc-800 rounded-2xl p-3.5 space-y-2">
        <div class="flex items-center justify-between text-xs text-zinc-400">
          <span>切換課表模式</span>
          <span class="text-emerald-400 text-[11px] cursor-pointer" onclick="toggleSplitSetting()"><i class="fa-solid fa-arrows-rotate mr-1"></i>重選課表</span>
        </div>
        <div class="grid grid-cols-2 gap-2">
          <select id="splitModeSelect" onchange="onSplitModeChange()" class="bg-zinc-800 border border-zinc-700 rounded-xl px-2.5 py-2 text-xs text-white focus:outline-none focus:border-emerald-500">
            <option value="PPL_REST_PPL">PPL Rest PPL (7日)</option>
            <option value="PPLUL">PPLUL (推/拉/腿/上/下)</option>
            <option value="FULLBODY">Full Body (全身 x2/x3)</option>
            <option value="CUSTOM">自訂模式</option>
          </select>
          <select id="workoutTypeSelect" onchange="onWorkoutTypeChange()" class="bg-zinc-800 border border-zinc-700 rounded-xl px-2.5 py-2 text-xs text-white focus:outline-none focus:border-emerald-500">
            <!-- 動態生成課堂 -->
          </select>
        </div>
      </div>

      <!-- 動作組數記錄器容器 -->
      <div id="exerciseCardsContainer" class="space-y-4">
        <!-- 動態產生每個動作卡片 -->
      </div>

      <!-- 加動作按鈕 -->
      <button onclick="promptNewExercise()" class="w-full py-3 border border-dashed border-zinc-700 hover:border-zinc-500 rounded-2xl text-xs font-semibold text-zinc-300 active:scale-[0.99] transition flex items-center justify-center gap-2">
        <i class="fa-solid fa-plus text-emerald-400"></i> 新增動作 (Exercise)
      </button>

      <!-- 晨重及有氧快記 -->
      <div class="bg-zinc-900 border border-zinc-800 rounded-2xl p-4 space-y-3">
        <div class="flex items-center justify-between text-xs">
          <span class="font-bold text-white">晨磅體重 & 有氧時間</span>
          <span id="targetWeightNote" class="text-zinc-400 text-[11px]">目標: 70.0 kg</span>
        </div>
        <div class="grid grid-cols-2 gap-3">
          <div class="bg-zinc-800/80 rounded-xl p-2.5 flex items-center justify-between">
            <input type="number" id="inputDailyWeight" step="0.1" placeholder="體重 kg" class="w-20 bg-transparent text-white font-bold text-base focus:outline-none" oninput="saveCurrentData()" />
            <span class="text-xs text-zinc-400">kg</span>
          </div>
          <div class="bg-zinc-800/80 rounded-xl p-2.5 flex items-center justify-between">
            <input type="number" id="inputDailyCardio" placeholder="有氧分鐘" class="w-20 bg-transparent text-white font-bold text-base focus:outline-none" oninput="saveCurrentData()" />
            <span class="text-xs text-zinc-400">分鐘</span>
          </div>
        </div>
      </div>

    </div>

    <!-- 頁籤 2: 歷史 (History) -->
    <div id="tab-history" class="tab-content hidden space-y-3">
      <div class="flex items-center justify-between px-1">
        <h2 class="text-sm font-bold text-white">過去訓練紀錄</h2>
        <button onclick="exportCSV()" class="text-xs text-emerald-400 flex items-center gap-1 hover:underline">
          <i class="fa-solid fa-download"></i> 匯出 CSV
        </button>
      </div>
      <div id="historyListContainer" class="space-y-2.5">
        <!-- 動態列出歷史記錄 -->
      </div>
    </div>

    <!-- 頁籤 3: 圖表 (Charts) -->
    <div id="tab-charts" class="tab-content hidden space-y-4">
      <div class="bg-zinc-900 border border-zinc-800 rounded-2xl p-4">
        <h3 class="text-xs font-bold text-zinc-300 mb-3">體重變化走勢 (kg)</h3>
        <div class="h-52 relative">
          <canvas id="chartWeight"></canvas>
        </div>
      </div>
      <div class="bg-zinc-900 border border-zinc-800 rounded-2xl p-4">
        <h3 class="text-xs font-bold text-zinc-300 mb-3">近 7 次訓練總容量 (kg)</h3>
        <div class="h-52 relative">
          <canvas id="chartVolume"></canvas>
        </div>
      </div>
    </div>

    <!-- 頁籤 4: 我的 (Settings) -->
    <div id="tab-settings" class="tab-content hidden space-y-4">
      <div class="bg-zinc-900 border border-zinc-800 rounded-2xl p-4 space-y-3">
        <h3 class="text-sm font-bold text-white">個人目標</h3>
        <div>
          <label class="text-xs text-zinc-400">目標體重 (kg)</label>
          <input type="number" id="settingTargetWeight" step="0.1" value="70.0" class="w-full bg-zinc-800 border border-zinc-700 rounded-xl px-3 py-2 text-sm text-white mt-1" onchange="saveProfileSettings()" />
        </div>
        <div>
          <label class="text-xs text-zinc-400">預設組間休息時間 (秒)</label>
          <input type="number" id="settingRestSec" value="90" class="w-full bg-zinc-800 border border-zinc-700 rounded-xl px-3 py-2 text-sm text-white mt-1" onchange="saveProfileSettings()" />
        </div>
      </div>
    </div>

  </main>

  <!-- 底部原生風格導覽列 (純黑色，無邊框突兀感) -->
  <nav class="fixed bottom-0 left-0 right-0 z-40 bg-zinc-950/95 backdrop-blur-md border-t border-zinc-800/80 px-6 py-2.5">
    <div class="max-w-md mx-auto flex justify-between">
      <button onclick="switchTab('workout')" id="navBtn-workout" class="flex flex-col items-center gap-1 text-emerald-400">
        <i class="fa-solid fa-dumbbell text-lg"></i>
        <span class="text-[10px] font-semibold">訓練</span>
      </button>
      <button onclick="switchTab('history')" id="navBtn-history" class="flex flex-col items-center gap-1 text-zinc-500">
        <i class="fa-solid fa-calendar-days text-lg"></i>
        <span class="text-[10px] font-semibold">歷史</span>
      </button>
      <button onclick="switchTab('charts')" id="navBtn-charts" class="flex flex-col items-center gap-1 text-zinc-500">
        <i class="fa-solid fa-chart-line text-lg"></i>
        <span class="text-[10px] font-semibold">圖表</span>
      </button>
      <button onclick="switchTab('settings')" id="navBtn-settings" class="flex flex-col items-center gap-1 text-zinc-500">
        <i class="fa-solid fa-user text-lg"></i>
        <span class="text-[10px] font-semibold">我的</span>
      </button>
    </div>
  </nav>

  <!-- 核心腳本邏輯 -->
  <script>
    // 課表預設
    const SPLITS = {
      PPL_REST_PPL: {
        title: "PPL 課表",
        days: [
          { key: "push1", label: "推日 (Push Day)", list: ["槓鈴臥推 (Bench Press)", "坐姿啞鈴肩推", "雙槓臂屈伸", "繩索三頭下壓"] },
          { key: "pull1", label: "拉日 (Pull Day)", list: ["引體上升 / 滑輪下拉", "胸支撐划船", "啞鈴二頭彎舉", "面拉 (Face Pull)"] },
          { key: "leg1", label: "腿日 (Leg Day)", list: ["槓鈴深蹲 (Squat)", "羅馬尼亞硬舉 (RDL)", "腿推機 (Leg Press)", "提踵 (Calf Raise)"] },
          { key: "rest", label: "休息日 (Rest Day)", list: [] }
        ]
      },
      PPLUL: {
        title: "PPLUL 課表",
        days: [
          { key: "push", label: "推日 (Push)", list: ["槓鈴臥推", "啞鈴上斜臥推", "側平舉", "三頭伸展"] },
          { key: "pull", label: "拉日 (Pull)", list: ["滑輪下拉", "槓鈴划船", "二頭彎舉"] },
          { key: "leg", label: "腿日 (Leg)", list: ["深蹲", "腿推", "腿後勾"] },
          { key: "upper", label: "上肢 (Upper)", list: ["肩推", "引體", "雙槓屈伸"] },
          { key: "lower", label: "下肢 (Lower)", list: ["硬舉", "分腿蹲", "核心懸垂提腿"] }
        ]
      },
      FULLBODY: {
        title: "Full Body 課表",
        days: [
          { key: "fba", label: "Full Body A", list: ["槓鈴深蹲", "槓鈴臥推", "滑輪下拉"] },
          { key: "fbb", label: "Full Body B", list: ["硬舉", "站姿肩推", "槓鈴划船"] }
        ]
      },
      CUSTOM: {
        title: "自訂課表",
        days: [{ key: "c1", label: "自由重訓日", list: ["深蹲", "臥推", "硬舉"] }]
      }
    };

    let todayStr = new Date().toISOString().split('T')[0];
    let appStore = JSON.parse(localStorage.getItem('cut_fit_records') || '{}');
    let appSettings = JSON.parse(localStorage.getItem('cut_fit_config') || JSON.stringify({
      targetWeight: 70.0,
      restSec: 90,
      splitMode: 'PPL_REST_PPL'
    }));

    let timerInterval = null;
    let timerRemaining = 0;
    let startTime = Date.now();

    window.addEventListener('DOMContentLoaded', () => {
      initDropdowns();
      loadTodayData();
      startWorkoutDurationClock();
    });

    // 啟動訓練時長計時
    function startWorkoutDurationClock() {
      setInterval(() => {
        const sec = Math.floor((Date.now() - startTime) / 1000);
        const h = String(Math.floor(sec / 3600)).padStart(2, '0');
        const m = String(Math.floor((sec % 3600) / 60)).padStart(2, '0');
        const s = String(sec % 60).padStart(2, '0');
        document.getElementById('workoutDurationText').innerText = `進行中 ${h}:${m}:${s}`;
      }, 1000);
    }

    function initDropdowns() {
      document.getElementById('splitModeSelect').value = appSettings.splitMode || 'PPL_REST_PPL';
      renderWorkoutTypeOptions();
    }

    function renderWorkoutTypeOptions() {
      const mode = appSettings.splitMode || 'PPL_REST_PPL';
      const preset = SPLITS[mode];
      const sel = document.getElementById('workoutTypeSelect');
      sel.innerHTML = '';
      preset.days.forEach(d => {
        const opt = document.createElement('option');
        opt.value = d.key;
        opt.innerText = d.label;
        sel.appendChild(opt);
      });
      document.getElementById('subRoutineTitle').innerText = `${preset.days[0].label} · ${preset.title}`;
    }

    function onSplitModeChange() {
      appSettings.splitMode = document.getElementById('splitModeSelect').value;
      localStorage.setItem('cut_fit_config', JSON.stringify(appSettings));
      renderWorkoutTypeOptions();
      onWorkoutTypeChange();
    }

    function onWorkoutTypeChange() {
      const selMode = appSettings.splitMode;
      const selKey = document.getElementById('workoutTypeSelect').value;
      const day = SPLITS[selMode].days.find(d => d.key === selKey);
      if (day) {
        document.getElementById('subRoutineTitle').innerText = `${day.label} · ${SPLITS[selMode].title}`;
        // 載入預設動作
        const defaultExercises = day.list.map(name => ({
          name: name,
          seat: "座椅格數: #3",
          sets: [
            { type: 'W', weight: 60, reps: 12, rpe: 7.0, done: true },
            { type: '常', weight: 100, reps: 8, rpe: 8.5, done: true }
          ]
        }));
        renderExercises(defaultExercises);
        saveCurrentData();
      }
    }

    function loadTodayData() {
      const data = appStore[todayStr] || null;
      if (data && data.exercises && data.exercises.length > 0) {
        document.getElementById('inputDailyWeight').value = data.weight || '';
        document.getElementById('inputDailyCardio').value = data.cardio || '';
        renderExercises(data.exercises);
      } else {
        // 初次進入載入第一課堂
        onWorkoutTypeChange();
      }
    }

    // 渲染動作卡片 (同截圖精緻排版，深黑無框風格)
    function renderExercises(exercises) {
      const container = document.getElementById('exerciseCardsContainer');
      container.innerHTML = '';

      exercises.forEach((ex, exIdx) => {
        const card = document.createElement('div');
        card.className = "bg-zinc-900 border border-zinc-800 rounded-2xl p-4 space-y-3";
        card.dataset.idx = exIdx;

        // 計算 1RM (Brzycki: Weight / (1.0278 - 0.0278 * Reps))
        let best1RM = 0;
        ex.sets.forEach(s => {
          const w = parseFloat(s.weight) || 0;
          const r = parseFloat(s.reps) || 0;
          if (w > 0 && r > 0 && r < 12) {
            const est = Math.round(w / (1.0278 - 0.0278 * r));
            if (est > best1RM) best1RM = est;
          }
        });

        let setRows = '';
        ex.sets.forEach((st, sIdx) => {
          const isWarm = st.type === 'W';
          const typeBadgeColor = isWarm ? 'bg-amber-500/20 text-amber-400 border border-amber-500/30' : 'bg-zinc-800 text-zinc-300';
          
          setRows += `
            <div class="flex items-center gap-2 py-1 text-xs">
              <span class="w-6 text-center text-zinc-500 font-mono font-bold">${sIdx + 1}</span>
              <button onclick="toggleSetType(${exIdx}, ${sIdx})" class="w-8 h-8 rounded-lg ${typeBadgeColor} font-bold text-xs flex items-center justify-center transition active:scale-95">
                ${st.type || '常'}
              </button>
              <div class="flex-1 bg-zinc-800 rounded-xl px-2 py-1.5 flex items-center border border-zinc-700/60">
                <input type="number" step="0.5" value="${st.weight}" class="w-full bg-transparent text-center text-white font-bold focus:outline-none" oninput="saveCurrentData()" />
              </div>
              <div class="flex-1 bg-zinc-800 rounded-xl px-2 py-1.5 flex items-center border border-zinc-700/60">
                <input type="number" value="${st.reps}" class="w-full bg-transparent text-center text-white font-bold focus:outline-none" oninput="saveCurrentData()" />
              </div>
              <div class="w-12 bg-zinc-800 rounded-xl px-1 py-1.5 flex items-center border border-zinc-700/60">
                <input type="number" step="0.5" value="${st.rpe || ''}" placeholder="-" class="w-full bg-transparent text-center text-white font-semibold focus:outline-none text-[11px]" oninput="saveCurrentData()" />
              </div>
              <button onclick="toggleDone(${exIdx}, ${sIdx})" class="w-8 h-8 rounded-xl ${st.done ? 'bg-emerald-500/20 text-emerald-400' : 'bg-zinc-800 text-zinc-600'} flex items-center justify-center transition">
                <i class="fa-solid fa-check text-xs"></i>
              </button>
            </div>
          `;
        });

        card.innerHTML = `
          <div class="flex items-center justify-between">
            <div>
              <h3 class="font-extrabold text-sm text-white">${ex.name}</h3>
              <p class="text-[11px] text-zinc-400 mt-0.5">${ex.seat || '器材設定: 無'} | 上次最佳: 100 kg × 8 次</p>
            </div>
            <button onclick="triggerRestTimer(90)" class="text-[11px] bg-zinc-800 hover:bg-zinc-700 text-zinc-300 px-2 py-1 rounded-lg">
              <i class="fa-regular fa-clock mr-1 text-emerald-400"></i>計時
            </button>
          </div>

          <div class="space-y-1">
            <div class="flex items-center gap-2 text-[10px] text-zinc-500 font-semibold px-0.5">
              <span class="w-6 text-center">組</span>
              <span class="w-8 text-center">類型</span>
              <span class="flex-1 text-center">重量(kg)</span>
              <span class="flex-1 text-center">次數</span>
              <span class="w-12 text-center">RPE</span>
              <span class="w-8 text-center">完成</span>
            </div>
            <div class="sets-list space-y-1">${setRows}</div>
          </div>

          <div class="flex items-center justify-between pt-1 border-t border-zinc-800/80 text-[11px]">
            <span class="text-zinc-500">估算 1RM: <strong class="text-zinc-300 font-mono">${best1RM > 0 ? best1RM + ' kg' : '-'}</strong> (Brzycki)</span>
            <div class="flex gap-2">
              <button onclick="addSet(${exIdx})" class="text-emerald-400 font-medium active:scale-95 transition">+ 加一組</button>
              <button onclick="removeExercise(${exIdx})" class="text-zinc-500 hover:text-rose-400">刪除</button>
            </div>
          </div>
        `;
        container.appendChild(card);
      });

      updateTotals();
    }

    // 數據收集與儲存
    function collectCards() {
      const cards = document.querySelectorAll('#exerciseCardsContainer > div');
      const exercises = [];
      cards.forEach(c => {
        const name = c.querySelector('h3').innerText;
        const sets = [];
        const rows = c.querySelectorAll('.sets-list > div');
        rows.forEach(r => {
          const type = r.querySelector('button').innerText.trim();
          const inputs = r.querySelectorAll('input');
          const isDone = r.querySelector('button:last-child').classList.contains('text-emerald-400');
          sets.push({
            type: type,
            weight: inputs[0].value,
            reps: inputs[1].value,
            rpe: inputs[2].value,
            done: isDone
          });
        });
        exercises.push({ name, seat: "座椅格數: #3", sets });
      });
      return exercises;
    }

    function saveCurrentData() {
      const ex = collectCards();
      appStore[todayStr] = {
        weight: document.getElementById('inputDailyWeight').value,
        cardio: document.getElementById('inputDailyCardio').value,
        exercises: ex
      };
      localStorage.setItem('cut_fit_records', JSON.stringify(appStore));
      updateTotals();
    }

    function updateTotals() {
      const ex = collectCards();
      let totalV = 0;
      let totalS = 0;
      ex.forEach(item => {
        item.sets.forEach(st => {
          const w = parseFloat(st.weight) || 0;
          const r = parseFloat(st.reps) || 0;
          if (w > 0 && r > 0) {
            totalV += (w * r);
            totalS++;
          }
        });
      });
      document.getElementById('statTotalVolume').innerHTML = `${Math.round(totalV)} <span class="text-sm font-normal text-zinc-400">kg</span>`;
      document.getElementById('statTotalSets').innerHTML = `${totalS} <span class="text-xs font-normal text-zinc-400">組</span>`;
    }

    // 組類型切換 (常 -> W熱身 -> D遞減)
    function toggleSetType(exIdx, sIdx) {
      const ex = collectCards();
      const current = ex[exIdx].sets[sIdx].type;
      const order = ['常', 'W', 'D'];
      const next = order[(order.indexOf(current) + 1) % order.length];
      ex[exIdx].sets[sIdx].type = next;
      renderExercises(ex);
      saveCurrentData();
    }

    function toggleDone(exIdx, sIdx) {
      const ex = collectCards();
      ex[exIdx].sets[sIdx].done = !ex[exIdx].sets[sIdx].done;
      renderExercises(ex);
      saveCurrentData();
      if (ex[exIdx].sets[sIdx].done) {
        triggerRestTimer(appSettings.restSec || 90);
      }
    }

    function addSet(exIdx) {
      const ex = collectCards();
      const sets = ex[exIdx].sets;
      const last = sets.length > 0 ? sets[sets.length - 1] : { type: '常', weight: 60, reps: 10, rpe: 8 };
      sets.push({ type: '常', weight: last.weight, reps: last.reps, rpe: last.rpe, done: false });
      renderExercises(ex);
      saveCurrentData();
    }

    function removeExercise(exIdx) {
      const ex = collectCards();
      ex.splice(exIdx, 1);
      renderExercises(ex);
      saveCurrentData();
    }

    function promptNewExercise() {
      const name = prompt("請輸入新增動作名稱 (例如: 啞鈴飛鳥 / 窄握臥推):");
      if (name && name.trim()) {
        const ex = collectCards();
        ex.push({
          name: name.trim(),
          seat: "自訂設定",
          sets: [{ type: '常', weight: 50, reps: 10, rpe: 8, done: false }]
        });
        renderExercises(ex);
        saveCurrentData();
      }
    }

    // 休息計時器邏輯
    function triggerRestTimer(sec) {
      clearInterval(timerInterval);
      timerRemaining = sec;
      const box = document.getElementById('restTimerBox');
      const text = document.getElementById('timerText');

      box.classList.add('bg-emerald-950', 'border-emerald-500');

      timerInterval = setInterval(() => {
        timerRemaining--;
        const m = Math.floor(timerRemaining / 60);
        const s = timerRemaining % 60;
        text.innerText = `${m > 0 ? m + 'm ' : ''}${s}s`;

        if (timerRemaining <= 0) {
          clearInterval(timerInterval);
          text.innerText = `${sec}s`;
          box.classList.remove('bg-emerald-950', 'border-emerald-500');
          if (navigator.vibrate) navigator.vibrate([200, 100, 200]);
        }
      }, 1000);
    }

    // 導覽切換
    function switchTab(tabId) {
      document.querySelectorAll('.tab-content').forEach(el => el.classList.add('hidden'));
      document.getElementById(`tab-${tabId}`).classList.remove('hidden');

      ['workout', 'history', 'charts', 'settings'].forEach(t => {
        const btn = document.getElementById(`navBtn-${t}`);
        if (t === tabId) {
          btn.className = "flex flex-col items-center gap-1 text-emerald-400";
        } else {
          btn.className = "flex flex-col items-center gap-1 text-zinc-500";
        }
      });

      if (tabId === 'history') renderHistoryList();
      if (tabId === 'charts') renderChartCanvas();
    }

    function renderHistoryList() {
      const container = document.getElementById('historyListContainer');
      container.innerHTML = '';
      const dates = Object.keys(appStore).sort().reverse();
      if (dates.length === 0) {
        container.innerHTML = `<div class="text-zinc-500 text-center py-8 text-xs">暫時未有歷史記錄</div>`;
        return;
      }
      dates.forEach(d => {
        const record = appStore[d];
        let totalVol = 0;
        (record.exercises || []).forEach(e => {
          (e.sets || []).forEach(s => totalVol += (parseFloat(s.weight) || 0) * (parseFloat(s.reps) || 0));
        });
        const item = document.createElement('div');
        item.className = "bg-zinc-900 border border-zinc-800 rounded-xl p-3 flex justify-between items-center text-xs";
        item.innerHTML = `
          <div>
            <div class="font-bold text-white">${d}</div>
            <div class="text-zinc-400 text-[11px] mt-0.5">體重: ${record.weight || '-'} kg · 有氧: ${record.cardio || 0}m</div>
          </div>
          <div class="text-right">
            <span class="text-emerald-400 font-mono font-bold">${Math.round(totalVol)} kg</span>
          </div>
        `;
        container.appendChild(item);
      });
    }

    function renderChartCanvas() {
      // 體重圖表
      const ctxW = document.getElementById('chartWeight').getContext('2d');
      const dates = Object.keys(appStore).sort().slice(-7);
      const weights = dates.map(d => appStore[d].weight ? parseFloat(appStore[d].weight) : null);

      new Chart(ctxW, {
        type: 'line',
        data: {
          labels: dates.map(d => d.slice(5)),
          datasets: [{ data: weights, borderColor: '#10b981', tension: 0.3, fill: false }]
        },
        options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } } }
      });
    }

    function exportCSV() {
      let csv = "Date,Weight(kg),Cardio(min),TotalVolume(kg)\n";
      Object.keys(appStore).sort().forEach(d => {
        const r = appStore[d];
        let vol = 0;
        (r.exercises || []).forEach(e => (e.sets || []).forEach(s => vol += (parseFloat(s.weight) || 0) * (parseFloat(s.reps) || 0)));
        csv += `${d},${r.weight||''},${r.cardio||0},${vol}\n`;
      });
      const blob = new Blob([csv], { type: 'text/csv' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = `workout_cut_${todayStr}.csv`;
      a.click();
    }
  </script>
</body>
</html>
